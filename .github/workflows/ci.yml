name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        # Only the portable core is installed in CI. Voice/vision/automation
        # packages (vosk, pyttsx3, sounddevice, pyautogui, torch) are optional at
        # runtime by design, so their absence must not break the import check.
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask requests beautifulsoup4 psutil numpy sympy

      - name: Byte-compile every module
        run: python -m compileall -q harry_core main.py tests tools

      - name: Import every subsystem
        run: python tests/import_check.py

      - name: Dashboard tests (deterministic, no model or hardware needed)
        run: python tests/dashboard_test.py

      - name: Smoke tests (live-model checks skip when Ollama is absent)
        run: python tests/smoke_test.py

      - name: System diagnostics
        run: python main.py --check

  packaging:
    name: Windows build check
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask requests beautifulsoup4 psutil numpy sympy pyinstaller
      - name: Build the EXE
        # Evidence that the packaged entry point still resolves. Artifacts are not
        # published from CI; releases are cut manually (see BUILD_INSTALL.md).
        run: python build_windows.py --no-model-copy
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: harry-dist-${{ github.sha }}
          path: dist/harry_dist
          if-no-files-found: error
          retention-days: 7
