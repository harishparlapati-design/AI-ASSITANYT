# Fly.io example. Adjust `app` and `primary_region` before deploying.
#
#   fly launch --no-deploy --copy-config --config deploy/fly.toml
#   fly volumes create harry_data --size 3 --region bom
#   fly secrets set HARRY_SESSION_SECRET=... OPENAI_API_KEY=...
#   fly deploy --config deploy/fly.toml
app = "harry-assistant"
primary_region = "bom"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  HARRY_HOSTED = "1"
  HARRY_HTTPS = "1"
  HARRY_DOCUMENTS_DIR = "/data/documents"
  HARRY_MEDIA_DIR = "/data/media"
  HARRY_ACCOUNTS_DB = "/data/accounts.db"

[[mounts]]
  source = "harry_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1        # SSE + in-process jobs need an awake machine

  [http_service.concurrency]
    type = "connections"
    hard_limit = 60
    soft_limit = 40

[[vm]]
  # 1 GB is the realistic floor: Python + document libraries + one request.
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[checks.health]
  type = "http"
  port = 8000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
